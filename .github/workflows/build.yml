name: build

on:
  push:
    branches: [main]
    paths: ['postgres/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cooclue/postgres:18.4-ext2
            ghcr.io/cooclue/postgres:18.4-${{ github.sha }}
